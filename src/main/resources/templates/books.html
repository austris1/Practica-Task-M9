<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All books</title>
</head>
<body>
<nav>
    <a href="/">Home</a> |
    <a href="/books">All books</a> |
    <span th:if="${loggedIn}">
    Logged in as <strong th:text="${username}">user</strong>
    (<span th:text="${isAdmin} ? 'ADMIN' : 'USER'">USER</span>)
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button type="submit">Log out</button>
    </form>
  </span>
    <a th:unless="${loggedIn}" href="/login">Log in</a>
</nav>
<main>
    <h1>All books</h1>
    <ul>
        <li th:each="book : ${books}">
            <strong th:text="${book.title}">Title</strong>
            — <span th:text="${book.author}">Author</span>
            | <span th:text="${book.genre}">Genre</span>
            | <span th:text="${book.publicationYear}">0</span>
            | Available: <span th:text="${book.available}">true</span>
        </li>
    </ul>

    <div th:if="${isAdmin}">
        <h2>Add book</h2>
        <form th:action="@{/books}" th:object="${form}" method="post">
            <label for="title">Title</label>
            <input id="title" th:field="*{title}" type="text" required>

            <label for="author">Author</label>
            <input id="author" th:field="*{author}" type="text" required>

            <label for="genre">Genre</label>
            <input id="genre" th:field="*{genre}" type="text" required>

            <label for="publicationYear">Publication year</label>
            <input id="publicationYear" th:field="*{publicationYear}" type="number" min="1" required>

            <button type="submit">Add book</button>
        </form>
    </div>
    <p th:unless="${isAdmin}">You can view books. Only ADMIN can add new books.</p>
</main>
</body>
</html>
